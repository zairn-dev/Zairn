name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Set version from release tag
        # The tag is passed as data (env), never spliced into script source.
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error('Release tag is not a semver version: ' + version);
              process.exit(1);
            }
            for (const dir of ['packages/sdk', 'packages/geo-drop']) {
              const path = dir + '/package.json';
              const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
              pkg.version = version;
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
              console.log(dir + ': ' + pkg.version);
            }
          "

      # npm auth comes from setup-node (registry-url) and NODE_AUTH_TOKEN,
      # which is exposed only to the publish steps — never written to disk
      # while build-time dependency code runs.
      - name: Build SDK
        run: pnpm --filter @zairn/sdk build
      - name: Build geo-drop
        run: pnpm --filter @zairn/geo-drop build

      - name: Publish @zairn/sdk
        run: pnpm --filter @zairn/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @zairn/geo-drop
        run: pnpm --filter @zairn/geo-drop publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
