name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK (dependency)
        run: pnpm --filter @zairn/sdk build
      - name: Smoke test SDK distribution
        run: pnpm --filter @zairn/sdk test:dist
      - name: Build geo-drop
        run: pnpm --filter @zairn/geo-drop build
      - name: Run unit tests
        run: pnpm test:unit

  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm --filter @zairn/sdk build
      - name: Build geo-drop
        run: pnpm --filter @zairn/geo-drop build
      - name: Type check web app
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Type check geo-drop-demo
        run: npx tsc --noEmit -p apps/geo-drop-demo/tsconfig.json
      - name: Build web app
        run: pnpm --filter web build
      - name: Build geo-drop-demo
        run: pnpm --filter geo-drop-demo build

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno check --no-lock supabase/functions/create-drop/index.ts supabase/functions/unlock-drop/index.ts supabase/functions/ipfs-proxy/index.ts
      - name: Test
        run: deno test -A --no-lock supabase/functions/
      # `supabase functions deploy` bundles with the Edge Runtime, which rejects
      # some node: built-ins that plain Deno accepts (node:vm broke unlock-drop).
      - name: Bundle with the Edge Runtime
        run: |
          for fn in create-drop unlock-drop ipfs-proxy; do
            docker run --rm -v "$PWD/supabase/functions:/home/deno/functions:ro" \
              public.ecr.aws/supabase/edge-runtime:v1.77.4 \
              bundle --entrypoint "/home/deno/functions/$fn/index.ts" --output /tmp/bundle.eszip
          done

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Supabase CLI
        run: |
          npx --yes supabase --version
      # Applies supabase/migrations — the same path production uses
      # (`supabase db push`), so CI tests the schema that actually ships.
      - name: Start local Supabase (applies migrations)
        run: npx supabase start
      - name: Create .env for tests
        run: |
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> .env
          echo "SUPABASE_ANON_KEY=$(npx supabase status -o json | jq -r '.ANON_KEY')" >> .env
      - name: Test connection
        run: pnpm test:connection
      - name: Test SDK
        run: pnpm test:sdk
      - name: Test features
        run: pnpm test:features
      - name: Test auth
        run: pnpm test:auth
      - name: Test chat
        run: pnpm test:chat
      - name: Stop Supabase
        if: always()
        run: npx supabase stop
